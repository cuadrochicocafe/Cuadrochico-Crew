name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # Publica el Worker (API + web) cada vez que algo llega a main y las pruebas pasan.
  # Necesita los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID del repo
  # (ver docs/pedidos/operacion.md). Sin ellos, este paso se salta y no falla.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Nunca dos publicaciones a la vez; si llegan seguidas, gana la más nueva.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Sin llave de Cloudflare no se publica
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Faltan CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID; no se publicó. Ver docs/pedidos/operacion.md."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
      - uses: pnpm/action-setup@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
      # Compila la web, aplica migraciones de D1 y publica el Worker.
      - run: pnpm run deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
