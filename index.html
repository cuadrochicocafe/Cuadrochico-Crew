*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px 90px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0 10px}
h1{font-size:19px;margin:0}h2{font-size:16px;margin:18px 0 6px}
.who{font-size:13px;color:var(--mut)}
button,select,input,textarea{font:inherit;color:inherit}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--acc);color:var(--acc-ink);font-weight:600;cursor:pointer}
button.sec{background:var(--chip);color:var(--ink)}
button.link{background:none;color:var(--mut);padding:6px;font-weight:500}
.tabs,.chips{display:flex;gap:8px;margin:6px 0 10px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;background:var(--chip);color:var(--ink);font-weight:600}
.chip.on{background:var(--acc);color:var(--acc-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.banner{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px;background:var(--okbg);color:var(--ok)}
.banner.warn{background:var(--warnbg);color:var(--warn)}
.test{background:var(--chip);color:var(--mut);font-size:12px;padding:6px 10px;border-radius:8px;margin:6px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.nm{flex:1;min-width:0}.nm small{display:block;color:var(--mut);font-size:12px}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ctl input,.ctl select,textarea,.login input,.login select{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg);font-size:16px}
.ctl input{width:92px;text-align:right}
.ml{font-size:12px;color:var(--mut);width:100%;text-align:right}.ml.low{color:var(--warn);font-weight:600}
.login{display:grid;gap:10px;margin-top:20px}.login input,.login select{width:100%}
textarea{width:100%;min-height:64px}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.sticky button{width:100%;max-width:720px;display:block;margin:0 auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90%}
.tag{display:inline-block;font-size:11px;background:var(--chip);border-radius:6px;padding:1px 6px;margin-left:4px;color:var(--mut)}
.mut{color:var(--mut);font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.btns button{flex:1;min-width:130px}.btns button:disabled{opacity:.5}.alt{margin:10px 0}.alt img{max-width:100%;border:1px solid var(--line);border-radius:10px}.alt a{color:var(--acc);font-weight:600}
@media print{.tabs,.chips,.sticky,header button,.noprint,.toast{display:none!important}body{background:#fff;color:#000}.card{border-color:#999}}
</style>
</head>

  layout(ctx, L, W){

  parseCsv(s){
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < s.length; i++) { const c = s[i];
      if (q) { if (c === '"') { if (s[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
      else if (c === '"') q = true;
      else if (c === ',') { row.push(cur); cur = ''; }
      else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
      else if (c !== '\r') cur += c;
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    return rows;

  fold(s){ return String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase(); },

  },
  catalogoDesdeCsv(csvIns, csvPrep){
    const g = (o, p) => { const k = Object.keys(o).find(x => x.indexOf(p) === 0); return k === undefined ? '' : o[k]; };
    const area = v => { const f = Logic.fold(v); return f === 'cafeteria' ? 'Cafetería' : f === 'ambos' ? 'Ambos' : 'Cocina'; };
    const si = v => Logic.fold(v) === 'si';
    const insumos = Logic.tablaCsv(Logic.parseCsv(csvIns), 'Insumo').map(o => ({id: o['insumo'], nombre: o['insumo'], categoria: o['categoria'] || '', proveedor: o['proveedor'] || '',

  $('#app').innerHTML = '<header><h1>Cuadrochico</h1></header>' + testBanner() +
    '<div class="login"><label>Nombre<select id="lu">' + names.map(n => '<option>' + esc(n) + '</option>').join('') + '</select></label>' +
    '<label>PIN<input id="lp" type="password" inputmode="numeric" autocomplete="off" maxlength="8"></label>' +
    '<button id="lb">Entrar</button><div class="mut" id="le"></div></div>';
  $('#lb').onclick = async () => {
    $('#le').textContent = '';
    try {
      const r = await Api.login($('#lu').value, $('#lp').value);
      S.token = r.token; S.user = r.nombre; S.rol = r.rol;
      store.set('cc_sesion', {token: r.token, nombre: r.nombre, rol: r.rol, exp: Date.now() + 6 * 3600 * 1000});
      S.cat = await Api.catalog(S.token); S.estado = await Api.estado(S.token); render();
    } catch (e) { $('#le').textContent = e.message; }
  };
}

function render(){
  const ger = S.rol === 'Gerente';
  let h = '<header><div><h1>Cuadrochico · Inventario</h1><div class="who">' + esc(S.user) + '</div></div><button class="link" id="out">Salir</button></header>' + testBanner();
  h += '<div class="tabs"><button class="chip ' + (S.tab === 'conteo' ? 'on' : '') + '" data-tab="conteo">Conteo</button>' +
       (S.resultado ? '<button class="chip ' + (S.tab === 'resultado' ? 'on' : '') + '" data-tab="resultado">Resultado</button>' : '') +
       (ger ? '<button class="chip ' + (S.tab === 'compras' ? 'on' : '') + '" data-tab="compras">Compras</button>' : '') + '</div>';
  h += S.tab === 'conteo' ? vistaConteo() : S.tab === 'resultado' ? vistaResultado() : vistaCompras();
  $('#app').innerHTML = h;
  $('#out').onclick = () => { store.del('cc_sesion'); S.token = null; renderLogin(); };
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = async () => { S.tab = b.dataset.tab; if (S.tab === 'compras') { try { S.estado = await Api.estado(S.token); } catch (e) { toast(e.message); } } render(); });
  document.querySelectorAll('[data-area]').forEach(b => b.onclick = () => { S.area = b.dataset.area; render(); });
  const gs = $('#guardar'); if (gs) gs.onclick = guardar;
  const ge = $('#extra'); if (ge) ge.onclick = enviarExtra;
  document.querySelectorAll('[data-share]').forEach(b => b.onclick = () => compartir(b.dataset.share));
  if (S.tab === 'resultado') iniciaArchivos().catch(() => toast('No se pudo preparar la imagen; usa Enviar texto'));
  const pr = $('#imprimir'); if (pr) pr.onclick = () => { try { window.print(); } catch (e) { toast('Usa el menú del navegador para imprimir o guardar como PDF'); } };
  document.querySelectorAll('[data-k]').forEach(el => { const v = S.vals[S.area][el.dataset.k]; if (v && v[el.dataset.f] != null) el.value = v[el.dataset.f]; });
  document.querySelectorAll('[data-o]').forEach(el => actualizaMl(el.dataset.o));
}

function bannerArea(a){
  const ult = S.estado && S.estado.ultimoConteo ? S.estado.ultimoConteo[a] : null, d = Logic.diasDesde(ult, Date.now());
  if (d === null) return '<div class="banner warn">' + esc(a) + ': aún no hay conteo. Toca contar.</div>';
  if (d >= 7) return '<div class="banner warn">' + esc(a) + ': último conteo hace ' + d + ' días (' + fecha(ult) + '). Toca contar.</div>';
  return '<div class="banner">' + esc(a) + ': último conteo el ' + fecha(ult) + '.</div>';
}
function vistaConteo(){
  const cat = S.cat, a = S.area;
  let h = '<div class="chips noprint">' + AREAS.map(x => '<button class="chip ' + (x === a ? 'on' : '') + '" data-area="' + x + '">' + x + '</button>').join('') + '</div>' + bannerArea(a);
  const ins = cat.insumos.filter(i => Logic.enArea(i.area, a)), groups = {};
  ins.forEach(i => (groups[i.categoria || 'Otros'] = groups[i.categoria || 'Otros'] || []).push(i));
  Object.keys(groups).sort().forEach(g => { h += '<h2>' + esc(g) + '</h2><div class="card">' + groups[g].map(filaInsumo).join('') + '</div>'; });
  const pr = cat.prep.filter(p => Logic.enArea(p.area, a));
  if (pr.length) h += '<h2>Preparaciones</h2><div class="card">' + pr.map(filaPrep).join('') + '</div>';
  h += '<h2>¿Falta algo que no está en la lista?</h2><div class="card"><textarea id="xt" placeholder="Insumo o cosa que hace falta"></textarea>' +
       '<div class="ctl" style="justify-content:space-between;margin-top:8px"><select id="xu"><option>Esta semana</option><option>Urgente</option><option>De temporada</option></select><button class="sec" id="extra">Enviar</button></div></div>';
  h += '<div class="sticky noprint"><button id="guardar">Guardar conteo de ' + esc(a) + '</button></div>';
  return h;
}
function filaInsumo(i){
  const k = 'i|' + i.id;
  const ctrl = /octavo/i.test(i.unidadConteo)
    ? '<select data-k="' + esc(k) + '" data-f="a"><option value="">—</option>' + [0,1,2,3,4,5,6,7,8].map(n => '<option value="' + n + '">' + n + '/8</option>').join('') + '</select>'
    : '<input data-k="' + esc(k) + '" data-f="a" type="text" inputmode="decimal" placeholder="0">';
  return '<div class="row"><div class="nm">' + esc(i.nombre) + '<small>' + esc(i.unidadConteo) + '</small></div><div class="ctl">' + ctrl + '</div></div>';
}
function filaPrep(p){
  const k = 'p|' + p.id;
  let ctrl;
  if (p.comoSeCuenta === 'Peso') ctrl = '<input data-k="' + esc(k) + '" data-f="a" type="text" inputmode="decimal" placeholder="g">';
  else ctrl = '<input data-k="' + esc(k) + '" data-f="a" type="text" inputmode="decimal" placeholder="enteras">' +
    '<select data-k="' + esc(k) + '" data-f="b"><option value="">abierta</option><option value="0">0%</option><option value="0.25">25%</option><option value="0.5">50%</option><option value="0.75">75%</option></select>';
  const hint = p.comoSeCuenta === 'Peso' ? 'Peso con botellón (g)' : 'Botellas enteras + nivel de la abierta';
  return '<div class="row"><div class="nm">' + esc(p.nombre) + (p.temporada ? '<span class="tag">temporada</span>' : '') + '<small>' + hint + '</small></div><div class="ctl">' + ctrl + '<div class="ml" data-o="' + esc(k) + '"></div></div></div>';
}
function actualizaMl(k){
  const el = Array.prototype.find.call(document.querySelectorAll('[data-o]'), x => x.dataset.o === k); if (!el) return;
  const p = S.cat.prep.find(x => 'p|' + x.id === k), v = S.vals[S.area][k] || {}, ml = Logic.calcMl(p, v, S.cat.cfg);
  if (ml === null) { el.textContent = ''; el.className = 'ml'; return; }
  const low = p.minimo != null && ml <= p.minimo;
  el.textContent = '≈ ' + fmt(ml) + ' ml' + (low ? ' · bajo el mínimo' : ''); el.className = 'ml' + (low ? ' low' : '');
}
function onInput(e){
  const t = e.target; if (!t.dataset || !t.dataset.k) return;
  const v = S.vals[S.area][t.dataset.k] = S.vals[S.area][t.dataset.k] || {}; v[t.dataset.f] = t.value;
  if (t.dataset.k.charAt(0) === 'p') actualizaMl(t.dataset.k);
}
document.addEventListener('input', onInput); document.addEventListener('change', onInput);

async function guardar(){
  const a = S.area, vals = S.vals[a], items = [];
  S.cat.insumos.forEach(i => { const v = vals['i|' + i.id]; const n = v ? Logic.num(v.a) : null; if (n !== null) items.push({tipo:'insumo', id:i.id, nombre:i.nombre, valor:n, unidad:i.unidadConteo}); });
  S.cat.prep.forEach(p => { const v = vals['p|' + p.id]; if (!v) return; const ml = Logic.calcMl(p, v, S.cat.cfg); if (ml === null) return;
    const valor = p.comoSeCuenta === 'Peso' ? Logic.num(v.a) : (Logic.num(v.a) || 0) + (Logic.num(v.b) || 0);
    items.push({tipo:'prep', id:p.id, nombre:p.nombre, valor:valor, unidad:p.comoSeCuenta === 'Peso' ? 'g con botellón' : 'botellas', ml:Math.round(ml)}); });
  if (!items.length) return toast('Anota al menos una cantidad');
  if (!confirm('Guardar ' + items.length + ' cantidades de ' + a + '?')) return;
  try {
    await Api.saveConteo(S.token, a, items); S.vals[a] = {}; S.estado = await Api.estado(S.token);
    const ahora = new Date().toISOString(), ult = items.map(it => ({tipo: it.tipo, id: it.id, area: a, valor: it.valor, ml: it.ml == null ? null : it.ml, ts: ahora}));
    let ft = ''; try { ft = new Date().toLocaleDateString('es-MX', {day: 'numeric', month: 'long', year: 'numeric'}); } catch (e) {}
    S.resultado = {area: a, L: Logic.lineasResultado(Logic.comprasArea(S.cat, ult, a), a, S.user, ft, fmt)}; S.archivos = null; S.alt = null; S.tab = 'resultado';
    toast('Conteo guardado'); render(); }
  catch (e) { toast(e.message); }
}
async function enviarExtra(){
  const texto = $('#xt').value.trim(); if (!texto) return toast('Escribe qué hace falta');
  try { await Api.saveExtra(S.token, {texto: texto, urgencia: $('#xu').value}); $('#xt').value = ''; toast('Enviado'); } catch (e) { toast(e.message); }
}

function vistaCompras(){
  const est = S.estado || {ultimos: [], extras: []}, r = Logic.compras(S.cat, est.ultimos);
  const ts = (est.ultimos || []).map(u => u.ts).sort().pop();
  let h = '<div class="mut">' + (ts ? 'Con base en el conteo más reciente (' + fecha(ts) + '). ' : 'Aún no hay conteos. ') + 'El mínimo se evalúa en cocina; si el insumo no se cuenta en cocina, en cafetería. Se avisa con existencia menor o igual al mínimo.</div>';
  h += '<button class="sec noprint" id="imprimir" style="margin:8px 0">Imprimir o guardar PDF</button>';
  h += '<h2>Por comprar</h2>';
  const gr = Logic.porProveedor(r.comprar);
  if (!gr.length) h += '<div class="card mut">Nada por comprar con los conteos actuales.</div>';
  gr.forEach(g => { h += '<div class="card"><strong>' + esc(g.proveedor) + '</strong>' + g.items.map(x => {
    const i = x.item; return '<div class="row"><div class="nm">' + esc(i.nombre) + '<small>Hay ' + fmt(x.valor) + ' ' + esc(i.unidadConteo) + ' (' + esc(x.area) + ') · mínimo ' + fmt(i.minimo) + '</small>' +
      '<small>Se compra por ' + esc(i.unidadCompra || '—') + (i.equivalencia ? ' · ' + esc(i.equivalencia) : '') + (i.dias ? ' · ' + esc(i.dias) : '') + '</small></div></div>'; }).join('') + '</div>'; });
  if (r.preparar.length) h += '<h2>Por preparar</h2><div class="card">' + r.preparar.map(x => '<div class="row"><div class="nm">' + esc(x.item.nombre) + '<small>Hay unos ' + fmt(x.ml) + ' ml (' + esc(x.area) + ') · mínimo ' + fmt(x.item.minimo) + ' ml</small></div></div>').join('') + '</div>';
  if ((est.extras || []).length) h += '<h2>Extras pedidos</h2><div class="card">' + est.extras.map(e => '<div class="row"><div class="nm">' + esc(e.texto) + '<small>' + esc(e.urgencia) + ' · ' + esc(e.usuario) + ' · ' + fecha(e.ts) + '</small></div></div>').join('') + '</div>';
  if (r.sinMinimo.length) h += '<h2>Sin mínimo definido</h2><div class="card mut">' + r.sinMinimo.map(esc).join(', ') + '</div>';
  if (r.sinConteo.length) h += '<h2>Sin conteo todavía</h2><div class="card mut">' + r.sinConteo.map(esc).join(', ') + '</div>';
  return h;
}

function vistaResultado(){
  const R = S.resultado; if (!R) return '';
  let h = '<div class="mut">Esta lista sale solo del conteo que acabas de guardar. Puedes enviarla por WhatsApp u otra aplicación.</div><div class="btns noprint">' +
    '<button data-share="imagen" class="sh" disabled>Compartir imagen</button><button data-share="pdf" class="sh" disabled>Compartir PDF</button><button class="sec sh" data-share="texto">Enviar texto</button></div><div id="alt" class="alt"></div><div class="card">';
  R.L.forEach(l => { h += l.k === 'h1' ? '<h2 style="margin-top:0">' + esc(l.t) + '</h2>' : l.k === 'h2' ? '<h2>' + esc(l.t) + '</h2>' : l.k === 'h3' ? '<strong>' + esc(l.t) + '</strong>' :
    l.k === 'b' ? '<div>• ' + esc(l.t) + '</div>' : '<div class="mut">' + esc(l.t) + '</div>'; });
  return h + '</div>';
}
function nombreArchivo(ext){ let d = new Date().toISOString().slice(0, 10); return 'conteo-' + S.resultado.area.toLowerCase().replace('í', 'i') + '-' + d + '.' + ext; }
async function iniciaArchivos(){
  if (S.archivos) return habilita();
  const R = S.resultado, c = document.createElement('canvas'), W = 900, ctx = c.getContext('2d'), lay = Logic.layout(ctx, R.L, W);
  c.width = W; c.height = lay.H; const x = c.getContext('2d'); x.fillStyle = '#ffffff'; x.fillRect(0, 0, W, lay.H); x.textBaseline = 'alphabetic';
  lay.items.forEach(it => { x.font = it.f; x.fillStyle = it.c; x.fillText(it.t, lay.P, it.y); });
  const pngBlob = await new Promise(r => c.toBlob(r, 'image/png')), dataPng = c.toDataURL('image/png'), jp = c.toDataURL('image/jpeg', 0.92).split(',')[1];
  const bin = atob(jp), bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const pdf = Logic.buildPdf(bytes, W, lay.H);
  S.archivos = {titulo: R.L[0].t, texto: Logic.textoPlano(R.L), dataPng: dataPng,
    png: new File([pngBlob], nombreArchivo('png'), {type: 'image/png'}), pdf: new File([pdf], nombreArchivo('pdf'), {type: 'application/pdf'})};
  habilita();
}
function habilita(){ document.querySelectorAll('.sh').forEach(b => b.disabled = false); }
async function compartir(kind){
  const a = S.archivos; if (!a) return toast('Preparando el archivo, intenta de nuevo');
  if (kind === 'texto') {
    try { if (navigator.share) { await navigator.share({title: a.titulo, text: a.texto}); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    return copiarTexto();
  }
  const file = kind === 'imagen' ? a.png : a.pdf;
  try { if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: a.titulo}); return; } }
  catch (e) { if (e && e.name === 'AbortError') return; }
  const el = $('#alt'); if (!el) return;
  if (kind === 'imagen') el.innerHTML = '<p class="mut">Tu navegador no permite compartir desde aquí. Mantén presionada la imagen para guardarla o enviarla.</p><img alt="Resultado del conteo" src="' + a.dataPng + '">';
  else { const u = URL.createObjectURL(a.pdf); el.innerHTML = '<p class="mut">Tu navegador no permite compartir desde aquí. Abre o descarga el PDF y envíalo desde ahí.</p><a href="' + u + '" download="' + esc(a.pdf.name) + '" target="_blank">Abrir PDF</a>'; }
}
async function copiarTexto(){
  const t = S.archivos.texto;
  try { await navigator.clipboard.writeText(t); toast('Texto copiado; pégalo en WhatsApp o donde quieras'); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Texto copiado'); } catch (_) { toast('No se pudo copiar'); } ta.remove(); }
}
start();
</script>
</body>
</html>
